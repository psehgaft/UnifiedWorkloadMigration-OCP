apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: legacy-api
  labels:
    app: legacy-api
    app.kubernetes.io/name: legacy-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: kubevirt-without-fear
spec:
  runStrategy: Always
  dataVolumeTemplates:
    - metadata:
        name: legacy-api-root
        labels:
          app: legacy-api
      spec:
        source:
          registry:
            url: docker://quay.io/containerdisks/fedora:latest
        storage:
          resources:
            requests:
              storage: 10Gi
  template:
    metadata:
      labels:
        app: legacy-api
        app.kubernetes.io/name: legacy-api
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: kubevirt-without-fear
    spec:
      evictionStrategy: LiveMigrate
      terminationGracePeriodSeconds: 60
      domain:
        cpu:
          cores: 1
        memory:
          guest: 2Gi
        resources:
          requests:
            cpu: 250m
            memory: 2Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      readinessProbe:
        tcpSocket:
          port: 8080
        initialDelaySeconds: 15
        periodSeconds: 5
        failureThreshold: 12
      livenessProbe:
        tcpSocket:
          port: 8080
        initialDelaySeconds: 60
        periodSeconds: 20
        failureThreshold: 3
      volumes:
        - name: rootdisk
          dataVolume:
            name: legacy-api-root
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |-
              #cloud-config
              user: fedora
              password: kubevirt
              chpasswd:
                expire: false
              write_files:
                - path: /usr/local/bin/legacy-api.py
                  permissions: '0755'
                  content: |
                    #!/usr/bin/env python3
                    import json
                    import os
                    import socket
                    from http.server import BaseHTTPRequestHandler, HTTPServer

                    STATE_DIR = "/var/lib/legacy-api"
                    COUNTER = os.path.join(STATE_DIR, "counter")
                    os.makedirs(STATE_DIR, exist_ok=True)

                    class Handler(BaseHTTPRequestHandler):
                        def do_GET(self):
                            try:
                                with open(COUNTER, "r", encoding="utf-8") as stream:
                                    count = int(stream.read().strip() or "0")
                            except (FileNotFoundError, ValueError):
                                count = 0
                            count += 1
                            with open(COUNTER, "w", encoding="utf-8") as stream:
                                stream.write(str(count))
                            payload = {
                                "runtime": "virtual-machine",
                                "backend": socket.gethostname(),
                                "persistent_request_count": count,
                                "message": "Hello from the KubeVirt VM"
                            }
                            body = json.dumps(payload).encode()
                            self.send_response(200)
                            self.send_header("Content-Type", "application/json")
                            self.send_header("Content-Length", str(len(body)))
                            self.end_headers()
                            self.wfile.write(body)

                        def log_message(self, fmt, *args):
                            return

                    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
                - path: /etc/systemd/system/legacy-api.service
                  permissions: '0644'
                  content: |
                    [Unit]
                    Description=Legacy API demo service
                    After=network-online.target
                    Wants=network-online.target

                    [Service]
                    ExecStart=/usr/bin/python3 /usr/local/bin/legacy-api.py
                    Restart=always
                    RestartSec=2

                    [Install]
                    WantedBy=multi-user.target
              runcmd:
                - [systemctl, daemon-reload]
                - [systemctl, enable, --now, legacy-api.service]
